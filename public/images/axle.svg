<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Axle orb">
  <style><![CDATA[
    .glow{transform-box:fill-box;transform-origin:center;animation:glowpulse 4.2s ease-in-out infinite;}
    @keyframes glowpulse{0%,100%{opacity:.7;transform:scale(.98);}50%{opacity:1;transform:scale(1.06);}}

    .blobs{isolation:isolate;transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite;}
    @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
    .blob{transform-box:fill-box;transform-origin:center;mix-blend-mode:screen;}
    .b-lime{animation:drift1 7s ease-in-out infinite;}
    .b-orange{animation:drift2 9s ease-in-out infinite;}
    .b-pink{animation:drift3 11s ease-in-out infinite;}
    .b-cyan{animation:drift4 13s ease-in-out infinite;}
    @keyframes drift1{0%,100%{transform:translate(-5px,-3px) scale(1);}33%{transform:translate(9px,7px) scale(1.1);}66%{transform:translate(5px,-6px) scale(.93);}}
    @keyframes drift2{0%,100%{transform:translate(5px,5px) scale(1.05);}33%{transform:translate(-8px,-5px) scale(.9);}66%{transform:translate(-3px,8px) scale(1.12);}}
    @keyframes drift3{0%,100%{transform:translate(3px,-5px) scale(.96);}33%{transform:translate(-7px,6px) scale(1.14);}66%{transform:translate(8px,3px) scale(1);}}
    @keyframes drift4{0%,100%{transform:translate(-4px,4px) scale(1.08);}33%{transform:translate(7px,-6px) scale(.92);}66%{transform:translate(-8px,-3px) scale(1.1);}}

    .grain{mix-blend-mode:overlay;opacity:.35;transform-box:fill-box;transform-origin:center;animation:grainshift .7s steps(2) infinite;}
    @keyframes grainshift{0%{transform:translate(0,0);}50%{transform:translate(-5px,4px);}100%{transform:translate(3px,-4px);}}
    .scan{mix-blend-mode:overlay;opacity:.3;transform-box:fill-box;transform-origin:center;animation:scan 6s linear infinite;}
    @keyframes scan{to{transform:translateY(3px);}}

    .float1{animation:float1 16s ease-in-out infinite;}
    .float2{animation:float2 19s ease-in-out infinite;}
    .float3{animation:float3 22s ease-in-out infinite;}
    @keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(16px,-12px);}}
    @keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-14px,13px);}}
    @keyframes float3{0%,100%{transform:translate(0,0);}33%{transform:translate(11px,9px);}66%{transform:translate(-9px,-7px);}}
    .npath{fill:none;stroke-width:1.3;stroke-dasharray:5 7;opacity:.6;animation:flow 3s linear infinite;}
    @keyframes flow{to{stroke-dashoffset:-48;}}
    .nnode{animation:bob 4s ease-in-out infinite;}
    @keyframes bob{0%,100%{opacity:.5;}50%{opacity:1;}}
    .star{animation:tw 5s ease-in-out infinite;}
    @keyframes tw{0%,100%{opacity:.22;}50%{opacity:.62;}}
  ]]></style>

  <defs>
    <radialGradient id="g-lime"><stop offset="0%" stop-color="#c9ff2e"/><stop offset="55%" stop-color="#c9ff2e" stop-opacity=".55"/><stop offset="100%" stop-color="#c9ff2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-orange"><stop offset="0%" stop-color="#ff6a1a"/><stop offset="55%" stop-color="#ff6a1a" stop-opacity=".55"/><stop offset="100%" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-pink"><stop offset="0%" stop-color="#ff2f86"/><stop offset="55%" stop-color="#ff2f86" stop-opacity=".55"/><stop offset="100%" stop-color="#ff2f86" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-cyan"><stop offset="0%" stop-color="#33ffe0"/><stop offset="55%" stop-color="#33ffe0" stop-opacity=".55"/><stop offset="100%" stop-color="#33ffe0" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-cream"><stop offset="0%" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="55%" stop-color="#fff6d8" stop-opacity=".14"/><stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9ff2e" stop-opacity="0.5"/>
      <stop offset="42%" stop-color="#ff2f86" stop-opacity="0.26"/>
      <stop offset="70%" stop-color="#ff2f86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-veil" cx="50%" cy="44%" r="62%">
      <stop offset="55%" stop-color="#0a0a0c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="g-mask">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="56%" stop-color="#fff"/>
      <stop offset="74%" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="86%" stop-color="#000"/>
    </radialGradient>
    <mask id="m-body"><circle cx="300" cy="190" r="108" fill="url(#g-mask)"/></mask>
    <mask id="m-orb"><circle cx="300" cy="190" r="100" fill="#fff"/></mask>

    <filter id="f-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="f-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="f-grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1"/>
    </filter>

    <!-- ax-fx-soft: idle displacement warp -->
    <filter id="ax-fx-soft" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.024" numOctaves="2" seed="2" result="n"/>
      <feOffset in="n" dy="0" result="m"><animate attributeName="dy" values="0;-180" dur="9s" repeatCount="indefinite"/></feOffset>
      <feDisplacementMap in="SourceGraphic" in2="m" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <pattern id="p-scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.1" fill="#000" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="600" height="380" fill="#0a0a0c"/>

  <!-- moving background graph lines -->
  <g stroke-linecap="round">
    <g class="float1">
      <path class="npath" stroke="#c9ff2e" d="M95 70 L55 172"/>
      <path class="npath" stroke="#33ffe0" d="M90 300 L55 172" style="animation-delay:.7s"/>
      <circle class="nnode" cx="95" cy="70" r="3.5" fill="#f3eee2"/>
      <circle class="nnode" cx="55" cy="172" r="3" fill="#f3eee2" style="animation-delay:.3s"/>
      <circle class="nnode" cx="90" cy="300" r="3" fill="#f3eee2" style="animation-delay:.8s"/>
    </g>
    <g class="float2">
      <path class="npath" stroke="#33ffe0" d="M505 90 L545 235" style="animation-delay:.5s"/>
      <path class="npath" stroke="#ff2f86" d="M545 235 L470 330" style="animation-delay:.9s"/>
      <circle class="nnode" cx="505" cy="90" r="3.5" fill="#f3eee2" style="animation-delay:.5s"/>
      <circle class="nnode" cx="545" cy="235" r="3.5" fill="#f3eee2" style="animation-delay:1s"/>
      <circle class="nnode" cx="470" cy="330" r="3" fill="#f3eee2" style="animation-delay:1.5s"/>
    </g>
    <g class="float3">
      <path class="npath" stroke="#ff6a1a" d="M470 330 L300 348" style="animation-delay:1.3s"/>
      <path class="npath" stroke="#c9ff2e" d="M300 48 L505 90" style="animation-delay:1.1s"/>
      <circle class="nnode" cx="300" cy="348" r="2.6" fill="#f3eee2" style="animation-delay:2s"/>
      <circle class="nnode" cx="300" cy="48" r="2.6" fill="#f3eee2" style="animation-delay:1.2s"/>
    </g>
    <g fill="#f3eee2">
      <circle class="star" cx="160" cy="120" r="1.3"/>
      <circle class="star" cx="448" cy="135" r="1.3" style="animation-delay:1.4s"/>
      <circle class="star" cx="200" cy="285" r="1.3" style="animation-delay:2.3s"/>
      <circle class="star" cx="430" cy="275" r="1.3" style="animation-delay:.9s"/>
    </g>
  </g>

  <rect width="600" height="380" fill="url(#g-veil)"/>

  <!-- idle Axle orb -->
  <g>
    <circle class="glow" cx="300" cy="190" r="122" fill="url(#g-glow)" filter="url(#f-glow)"/>
    <g filter="url(#ax-fx-soft)">
      <g mask="url(#m-body)">
        <g class="blobs">
          <circle class="blob b-lime"   cx="278" cy="170" r="74" fill="url(#g-lime)"   filter="url(#f-blur)"/>
          <circle class="blob b-orange" cx="324" cy="168" r="76" fill="url(#g-orange)" filter="url(#f-blur)"/>
          <circle class="blob b-pink"   cx="322" cy="214" r="76" fill="url(#g-pink)"   filter="url(#f-blur)"/>
          <circle class="blob b-cyan"   cx="276" cy="212" r="74" fill="url(#g-cyan)"   filter="url(#f-blur)"/>
          <circle cx="300" cy="188" r="62" fill="url(#g-cream)"/>
        </g>
        <rect class="grain" x="192" y="82" width="216" height="216" filter="url(#f-grain)" mask="url(#m-orb)"/>
        <rect class="scan" x="200" y="82" width="200" height="216" fill="url(#p-scan)" mask="url(#m-orb)"/>
      </g>
    </g>
  </g>
</svg>
